<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitPlay - Tebak Angka</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0;
         display: flex; flex-direction: column; align-items: center; padding: 2rem; }
  .card { background: #1e293b; padding: 2rem; border-radius: 16px; max-width: 360px; width: 100%; text-align: center; }
  input { font-size: 1.2rem; padding: .6rem; width: 5rem; text-align: center; border-radius: 8px; border: 0; }
  button { font-size: 1rem; padding: .6rem 1rem; margin-left: .5rem; border: 0; border-radius: 8px;
           background: #38bdf8; color: #0f172a; cursor: pointer; }
  #pesan { margin: 1rem 0; min-height: 1.5rem; }
</style>
</head>
<body>
<div class="card">
  <h1>Tebak Angka</h1>
  <p>Tebak angka 1 sampai 100</p>
  <input id="tebakan" type="number" min="1" max="100">
  <button onclick="tebak()">Tebak</button>
  <div id="pesan"></div>
  <p>Percobaan: <span id="jumlah">0</span></p>
  <button onclick="ulang()">Main lagi</button>
</div>
<script>
  let rahasia, jumlah;
  function ulang() {
    rahasia = Math.floor(Math.random() * 100) + 1;
    jumlah = 0;
    document.getElementById('jumlah').textContent = 0;
    document.getElementById('pesan').textContent = '';
    document.getElementById('tebakan').value = '';
  }
  function tebak() {
    const t = Number(document.getElementById('tebakan').value);
    if (!t) return;
    jumlah++;
    document.getElementById('jumlah').textContent = jumlah;
    const p = document.getElementById('pesan');
    if (t === rahasia) p.textContent = 'Benar! Hebat 🎉';
    else p.textContent = t < rahasia ? 'Terlalu kecil ⬆️' : 'Terlalu besar ⬇️';
  }
  ulang();
</script>
</body>
</html>
